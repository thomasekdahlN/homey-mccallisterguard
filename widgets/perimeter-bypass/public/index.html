<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <style>
    :root { --fg: var(--homey-text-color, #1d1d1f); --muted: rgba(128, 128, 128, 0.95); --line: rgba(128, 128, 128, 0.35); --accent: #1a531a; --danger: #c0392b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; color: var(--fg); font-family: var(--homey-font-family, -apple-system, system-ui, sans-serif); }
    .wrap { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    button { font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; padding: 0 8px; }
    button:disabled { opacity: 0.5; }
    .sub { font-size: 12px; color: var(--muted); }
    .err { font-size: 12px; color: var(--danger); }
    .hidden { display: none; }
    .title { font-size: 15px; font-weight: 700; }
    .state.on { color: #2f6fd0; font-weight: 600; font-size: 14px; }
    .buttons { display: flex; gap: 8px; }
    .buttons button { flex: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title" id="title"></div>
    <div class="sub state" id="state">…</div>
    <div class="buttons" id="buttons"></div>
    <div class="err hidden" id="err"></div>
  </div>
  <script src="/homey.js" data-origin="settings"></script>
  <script>
    let H; let labels = {}; let status = null; let offset = 0; let busy = false; let timer = null;
    const $ = (id) => document.getElementById(id);
    const L = (k, v) => String(labels[k] || k).replace(/\{(\w+)\}/g, (m, n) => (v && n in v ? v[n] : m));

    function parseDurations(raw) {
      const list = String(raw || '1,5,15').split(',').map((x) => parseFloat(x.trim())).filter((x) => x > 0 && x <= 1440);
      return (list.length ? list : [1, 5, 15]).slice(0, 4);
    }
    function fmt(ms) {
      const total = Math.max(0, Math.ceil(ms / 1000));
      const m = Math.floor(total / 60); const s = total % 60;
      return m + ':' + String(s).padStart(2, '0');
    }

    function renderState() {
      const el = $('state');
      const left = status && status.perimeterBypassEndsAt ? status.perimeterBypassEndsAt - (Date.now() + offset) : 0;
      if (left > 0) { el.textContent = L('bypass_remaining', { time: fmt(left) }); el.classList.add('on'); }
      else { el.textContent = L('bypass_inactive'); el.classList.remove('on'); }
    }
    function showErr(m) { $('err').textContent = m; $('err').classList.toggle('hidden', !m); }

    async function refresh() {
      try {
        status = await H.api('GET', '/status');
        offset = status.now - Date.now();
        showErr(''); renderState();
      } catch (e) { showErr(L('error')); }
      clearTimeout(timer);
      timer = setTimeout(() => { if (!document.hidden) refresh(); }, 15000);
    }

    async function onHomeyReady(homey) {
      H = homey;
      try { labels = (await H.api('GET', '/labels')).labels; } catch (e) { /* keep keys */ }
      $('title').textContent = L('bypass_title');
      parseDurations((H.getSettings() || {}).durations).forEach((min) => {
        const b = document.createElement('button');
        b.textContent = L('minutes', { n: min });
        b.onclick = async () => {
          if (busy) return;
          busy = true; b.disabled = true;
          try { await H.api('POST', '/bypass', { duration: Math.round(min * 60) }); } catch (e) { showErr(L('error')); }
          busy = false; b.disabled = false; refresh();
        };
        $('buttons').appendChild(b);
      });
      setInterval(renderState, 1000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
      H.ready();
      refresh();
    }
  </script>
</body>
</html>
